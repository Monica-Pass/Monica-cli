name: Build and verify release packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rustflags: ''
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MDBX_REVISION: f004673ef07a04c31702eaf1015e062f29730537
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: ${{ matrix.rustflags }}
    defaults:
      run:
        working-directory: monica-pass-cli
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: monica-pass-cli
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Monica-Pass/Mdbx
          ref: ${{ env.MDBX_REVISION }}
          path: mdbx
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.97.0'
          targets: ${{ matrix.target }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-downloads-v1-${{ hashFiles('monica-pass-cli/Cargo.lock') }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Optimized KDF tests share the release profile with packaged binaries.
      # Serial execution bounds memory use; a debug suite previously timed out.
      - name: Test all targets in release mode
        run: cargo test --release --locked --all-targets --target ${{ matrix.target }} -- --test-threads=1
      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package and verify extracted binaries
        run: python scripts/package_release.py --target ${{ matrix.target }} --engine-revision "$MDBX_REVISION" --output ../dist
      - name: Verify command documentation
        run: |
          if [[ "${{ runner.os }}" == Windows ]]; then suffix=.exe; else suffix=; fi
          node docs/reference/build.mjs --check --bin "target/${{ matrix.target }}/release/monica-pass$suffix"
      - name: Bundle corresponding source and locked dependencies
        if: runner.os == 'Linux'
        run: python scripts/package_source.py --engine-revision "$MDBX_REVISION" --output ../dist
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
